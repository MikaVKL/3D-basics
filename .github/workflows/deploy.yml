name: Deploy to GitHub Pages

# Baut das Spiel und veröffentlicht es auf GitHub Pages - läuft auf
# GitHub-eigenen Servern, nicht lokal. So bekommt man eine echte
# https://<user>.github.io/<repo>/ URL, die auch auf Tablets/Handys
# ohne eigenen Dev-Server funktioniert.
on:
  push:
    branches:
      - main
      - claude/modest-keller-5dphta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
